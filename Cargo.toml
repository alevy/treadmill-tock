[package]
name = "treadmill-tock"
version = "0.1.0"
authors = ["Treadmill Project Developers <treadmill@tockos.org>"]
edition = "2024"
description = "Drive a Tock board held in a Treadmill testbed from the `tock` CLI"
publish = false

[[bin]]
name = "tml-tock-agent"
path = "src/bin/tml-tock-agent.rs"

[[bin]]
name = "tock-transport-treadmill"
path = "src/bin/tock-transport-treadmill.rs"
required-features = ["transport"]

# The two binaries have genuinely different needs, and saying so in features
# is what keeps the in-image agent small. `tml-tock-agent` reads a JSON file
# and writes config: no switchboard client, no async runtime, no TLS. Built
# with `--no-default-features` it drops reqwest, rustls and aws-lc-sys
# entirely -- which is most of the dependency tree, all of the C, and the
# only thing that made cross-compiling it for the image awkward.
# Every integration test drives the transport, so they follow its feature
# rather than failing to compile when the agent is built alone.
[[test]]
name = "transport_handshake"
required-features = ["transport"]

[[test]]
name = "tunnel_concurrency"
required-features = ["transport"]

[[test]]
name = "console_push"
required-features = ["transport"]

[features]
default = ["transport"]
transport = [
  "dep:treadmill-client",
  "dep:tokio",
  "treadmill-rs/client",
]

# This crate sits downstream of two projects and upstream of neither, so both
# arrive as git dependencies pinned to an exact revision. Neither pin is a
# release: they are the commits this was developed against, and nothing will
# tell you when they go stale -- `cargo update` will not move them and no CI
# here watches either repository. Bump them deliberately, and re-run the
# manual verification in `docs/` when you do.
#
#   tock-proto     -- the protocol `tock` speaks to a transport.
#                     48ff38f is the tip of `origin/main`.
#   treadmill-rs   -- Treadmill's wire types and switchboard client.
#   treadmill-client -- session, profile and job-service WebSocket mechanics.
#                     9bc2f8f is the tip of `client-library`, which is not yet
#                     merged to treadmill's `main`.
#
# The dependency points one way only: neither tockloader-ng nor treadmill may
# ever depend on this crate.
[dependencies]
tock-proto = { git = "https://github.com/alevy/tockloader-next", rev = "48ff38f" }
treadmill-rs = { git = "https://github.com/treadmill-tb/treadmill", rev = "9bc2f8f" }
treadmill-client = { git = "https://github.com/treadmill-tb/treadmill", rev = "9bc2f8f", optional = true, features = [
  "profile",
  "ws",
] }

anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tokio = { version = "1.54.1", optional = true, default-features = false, features = [
  "rt",
  "rt-multi-thread",
  "io-util",
  "macros",
  "net",
  "sync",
  "time",
] }
toml = "1.2.0"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

# Inlined from treadmill's workspace lints, which this crate used to inherit.
[lints.clippy]
complexity = { level = "deny", priority = -1 }
type_complexity = "allow"
result_large_err = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
from_str_radix_10 = "allow"
